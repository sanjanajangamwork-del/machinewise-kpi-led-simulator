<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MachineWise | LED Strip Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="eyebrow">MACHINEWISE</span>
            <h1>LED Strip Controller</h1>
        </div>
        <div class="connection"><i></i>Backend connected</div>
    </header>

    <main>
        <p class="page-description">Configure your machine KPI connection, manage LED presets and control your strips.</p>
        <div id="message" class="notice" role="status"></div>

        <div class="grid">
            <section class="card machine-config-card">
                <div class="card-heading"><h2>Machine Configuration</h2></div>
                <label for="machineChannelId">KPI Channel ID</label>
                <input id="machineChannelId" type="text" placeholder="Enter KPI Channel ID (e.g. kpi/12345)" autocomplete="off">
                <button id="saveMachineConfigBtn" class="button">Save Configuration</button>
            </section>

            <section class="card">
                <div class="card-heading"><h2>Strip Registration</h2></div>
                <div class="form-row strip-fields">
                    <div>
                        <label for="stripId">Strip ID</label>
                        <input id="stripId" type="text" placeholder="e.g. strip1">
                    </div>
                    <div>
                        <label for="stripLedCount">LED Count</label>
                        <input id="stripLedCount" type="number" min="1" value="60">
                    </div>
                    <div>
                        <label for="stripMode">Mode</label>
                        <select id="stripMode">
                            <option value="clock">clock</option>
                            <option value="preset">preset</option>
                        </select>
                    </div>
                </div>
                <button id="registerStripBtn" class="button">Register Strip</button>
            </section>

            <section class="card">
                <div class="card-heading"><h2>Preset Manager</h2></div>
                <div class="form-row">
                    <div>
                        <label for="presetName">Preset Name</label>
                        <input id="presetName" type="text" placeholder="e.g. Party Mode">
                    </div>
                    <div>
                        <label for="presetColors">LED Sequence</label>
                        <input id="presetColors" type="text" placeholder="e.g. R,R,G,G,B,B">
                    </div>
                </div>
                <button id="savePresetBtn" class="button">Save Preset</button>
                <div class="select-row">
                    <label for="managePreset">Select Preset</label>
                    <select id="managePreset">
                        <option value="">Choose a preset</option>
                    </select>
                </div>
            </section>

            <section class="card controller-card">
                <div class="card-heading"><h2>Strip Controller</h2></div>
                <div class="form-row">
                    <div>
                        <label for="targetStrip">Select Strip</label>
                        <select id="targetStrip">
                            <option value="">Choose a strip</option>
                        </select>
                    </div>
                    <div>
                        <label for="targetPreset">Select Preset</label>
                        <select id="targetPreset">
                            <option value="">Choose a preset</option>
                        </select>
                    </div>
                </div>
                <button id="applyPresetBtn" class="button" disabled>Apply Preset</button>
            </section>
        </div>
    </main>
</body>
</html>
